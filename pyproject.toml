[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rescueswarm"
version = "0.1.0"
description = "Distributed smartphone computing for drone-based search and rescue without internet access."
requires-python = ">=3.10"
dependencies = [
    "ultralytics",
    "opencv-python",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["rescueswarm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
