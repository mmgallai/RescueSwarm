name: Corrected validation parity
on:
  workflow_dispatch:
  push:
    branches: [codex/swift-integration]
    paths:
      - '.github/workflows/corrected-parity.yml'
      - 'rescue-swarm-ios/tools/parity/**'
      - 'rescue-swarm-ios/Tests/RescueSwarmCoreTests/CorrectedValidationParityTests.swift'
      - 'rescue-swarm-ios/Sources/RescueSwarmCore/PersonDetector.swift'
permissions:
  contents: read
jobs:
  parity:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rescue-swarm-ios
    env:
      PARITY_ROOT: ${{ github.workspace }}/rescue-swarm-ios/TestResults/corrected-parity
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated comparison dependencies
        run: |
          python -m venv .venv-parity
          .venv-parity/bin/pip install coremltools==9.0 opencv-python-headless==4.11.0.86 numpy==2.2.6 Pillow==11.2.1 scipy==1.15.3
      - name: Download and hash-verify frozen corrected validation sample
        run: .venv-parity/bin/python tools/parity/compare.py provision --root "$PARITY_ROOT"
      - name: Actual Swift detector and exact input-pixel export
        run: swift test --filter CorrectedValidationParityTests
      - name: Python reference and shared-pixel diagnostic
        run: .venv-parity/bin/python tools/parity/compare.py run --root "$PARITY_ROOT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-validation-parity-reports
          path: rescue-swarm-ios/TestResults/corrected-parity/*.json
