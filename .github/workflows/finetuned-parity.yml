name: Fine-tuned detector parity
on:
  workflow_dispatch:
  push:
    branches: [codex/swift-integration]
    paths:
      - '.github/workflows/finetuned-parity.yml'
      - 'rescue-swarm-ios/tools/parity/export_finetuned.py'
      - 'rescue-swarm-ios/tools/parity/checkpoints/**'
permissions:
  contents: read
jobs:
  parity:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rescue-swarm-ios
    env:
      PARITY_ROOT: ${{ github.workspace }}/rescue-swarm-ios/TestResults/finetuned-parity
      PARITY_MODEL: ${{ github.workspace }}/rescue-swarm-ios/TestResults/finetuned-parity/d85-best.mlpackage
      PARITY_MANIFEST: ${{ github.workspace }}/rescue-swarm-ios/TestResults/finetuned-parity/manifest.json
      PARITY_CHECKPOINT: ${{ github.workspace }}/rescue-swarm-ios/tools/parity/checkpoints/d85-best.pt
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated export and inference dependencies
        run: |
          python -m venv .venv-parity
          .venv-parity/bin/pip install coremltools==9.0 torch==2.7.0 torchvision==0.22.0 ultralytics==8.4.171 opencv-python==4.11.0.86 opencv-python-headless==4.11.0.86 numpy==2.2.6 Pillow==11.2.1 scipy==1.15.3
      - name: Export an immutable checkpoint copy, outside the app
        run: .venv-parity/bin/python tools/parity/export_finetuned.py
      - name: Hash-verify same frozen corrected validation sample
        run: .venv-parity/bin/python tools/parity/compare.py provision --root "$PARITY_ROOT"
      - name: Actual Swift detector with candidate model
        run: swift test --filter CorrectedValidationParityTests
      - name: Original PyTorch versus CoreML, Python versus Swift
        run: .venv-parity/bin/python tools/parity/compare.py run --root "$PARITY_ROOT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finetuned-parity-reports
          path: rescue-swarm-ios/TestResults/finetuned-parity/*.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: finetuned-coreml-candidate
          path: rescue-swarm-ios/TestResults/finetuned-parity/d85-best.mlpackage
