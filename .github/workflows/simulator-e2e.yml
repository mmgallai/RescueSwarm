name: Simulator end-to-end
on:
  push:
    branches: [codex/swift-integration]
  workflow_dispatch:
    inputs:
      separate_simulators:
        description: Run three separate simulators (requires sufficient host resources)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    timeout-minutes: 35
    defaults:
      run:
        working-directory: rescue-swarm-ios
    steps:
      - uses: actions/checkout@v6
      - name: Record runner environment
        run: |
          xcodebuild -version
          sysctl hw.memsize hw.ncpu
          xcrun simctl list runtimes
      - name: Build simulator app with isolated test driver
        run: xcodebuild -project RescueSwarm.xcodeproj -scheme RescueSwarm -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG CODE_SIGNING_ALLOWED=NO build
      - name: One coordinator and two real Core ML workers
        env:
          SEPARATE_SIMULATORS: ${{ inputs.separate_simulators || 'false' }}
        run: |
          if [ "$SEPARATE_SIMULATORS" = "true" ]; then
            python3 tools/simulator_e2e.py --app DerivedData/Build/Products/Debug-iphonesimulator/RescueSwarm.app
          else
            python3 tools/simulator_e2e.py --app DerivedData/Build/Products/Debug-iphonesimulator/RescueSwarm.app --embedded-workers
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-e2e-reports
          path: rescue-swarm-ios/TestResults/simulator-e2e
